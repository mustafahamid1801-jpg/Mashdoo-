<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>For Mashdooo ❤️</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #ffe6f0, #ffd1e1);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      width: min(92vw, 520px);
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      padding: 22px 18px 26px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.18);
      text-align: center;
      position: relative;
    }

    h1 {
      margin: 8px 0 10px;
      color: #ff2f6d;
      font-size: 28px;
    }

    p {
      margin: 0 0 14px;
      font-size: 16px;
      color: #333;
      line-height: 1.4;
    }

    .photo {
      width: 210px;
      height: 210px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 10px 24px rgba(0,0,0,0.2);
      border: 4px solid rgba(255,47,109,0.25);
      margin: 10px auto 16px;
      display: block;
    }

    .btnRow {
      display: flex;
      gap: 14px;
      justify-content: center;
      align-items: center;
      margin-top: 18px;
      position: relative;
      height: 54px;
    }

    button {
      padding: 12px 18px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #yesBtn {
      background: #ff2f6d;
      color: #fff;
      box-shadow: 0 10px 20px rgba(255,47,109,0.35);
    }

    #noBtn {
      background: #d9d9d9;
      color: #222;
      position: fixed; /* lets it dodge anywhere on screen */
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .soundHint {
      margin-top: 14px;
      font-size: 13px;
      color: #555;
    }

    #soundBtn {
      margin-top: 10px;
      background: #111;
      color: #fff;
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 999px;
    }

    /* Hide the YouTube iframe */
    #playerWrap {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
      top: -9999px;
    }
  </style>
</head>
<body>

  <!-- Hidden YouTube audio source -->
  <div id="playerWrap">
    <div id="player"></div>
  </div>

  <div class="card" id="card">
    <h1>Mashdooo 💖</h1>
    <p>
      I just wanted to tell you something…<br/>
      You make everything better 🥰
    </p>

    <!-- Put your image file in the same folder and name it photo.jpg -->
    <img class="photo" src="photo.jpg" alt="Mashdooo photo" />

    <h1>Will you be my Valentine? 💘</h1>

    <div class="btnRow">
      <button id="yesBtn">Yes 💞</button>
    </div>

    <div class="soundHint">Tap once anywhere if the music doesn’t start.</div>
    <button id="soundBtn">🔊 Turn sound on</button>
  </div>

  <button id="noBtn">No 🙃</button>

  <script>
    // --------- NO BUTTON DODGE ----------
    const noBtn = document.getElementById("noBtn");

    function moveNoButton() {
      const pad = 12;
      const maxX = window.innerWidth - noBtn.offsetWidth - pad;
      const maxY = window.innerHeight - noBtn.offsetHeight - pad;
      const x = Math.max(pad, Math.floor(Math.random() * maxX));
      const y = Math.max(pad, Math.floor(Math.random() * maxY));
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.transform = "none";
    }

    noBtn.addEventListener("mouseover", moveNoButton);
    noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveNoButton(); }, { passive: false });

    // Put it somewhere not covering the card initially
    setTimeout(moveNoButton, 200);

    // --------- YES CLICK ----------
    const yesBtn = document.getElementById("yesBtn");
    yesBtn.addEventListener("click", () => {
      document.body.innerHTML = `
        <div style="text-align:center; padding: 40px;">
          <h1 style="color:#ff2f6d; font-size:44px; margin:0;">YAAAY 💖🥰</h1>
          <p style="font-size:22px; margin:14px 0 0;">Mashdooo, you just made me the happiest ❤️</p>
          <p style="font-size:18px; margin:10px 0 0;">Now we celebrate 😏💘</p>
        </div>
      `;
    });

    // --------- YOUTUBE BACKGROUND MUSIC ----------
    // Official upload: EgmXTmj62ic
    const YT_ID = "EgmXTmj62ic";

    let player;
    let started = false;

    // Loads YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('player', {
        height: '0',
        width: '0',
        videoId: YT_ID,
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          playsinline: 1,
          loop: 1,
          playlist: YT_ID
        },
        events: {
          onReady: (event) => {
            // Try to autoplay muted (most browsers allow this)
            event.target.mute();
            event.target.playVideo();
            started = true;
          }
        }
      });
    };

    // Some browsers require user interaction:
    function tryStart() {
      if (!player) return;
      if (!started) {
        player.mute();
        player.playVideo();
        started = true;
      }
    }
    document.addEventListener("click", tryStart, { once: true });

    // Unmute button (user gesture)
    document.getElementById("soundBtn").addEventListener("click", () => {
      if (!player) return;
      player.unMute();
      player.setVolume(70);
      player.playVideo();
    });
  </script>
</body>
</html>
